# MEGAMIND — MCP REGISTRY
# The expectation: every data source will eventually have an MCP.
# Adding a new source = add one entry here. No code changes.
#
# Status: active | planned | future
# Mode:   pull (Claude queries on demand) | push (data arrives continuously)

memory:
  mem0:
    status: active
    package: mem0ai
    mode: pull
    notes: Session memory and recent context. Fast retrieval.
  qdrant:
    status: active
    package: qdrant-client
    mode: pull
    notes: Long-term vector store. Pattern clustering. Behavioral signatures over time.

